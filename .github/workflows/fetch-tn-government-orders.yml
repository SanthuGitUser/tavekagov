name: Fetch TN Government Orders

on:
  schedule:
    # 11:00 PM IST (Asia/Kolkata) = 17:30 UTC
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-government-orders:
    runs-on: ${{ vars.TN_GOV_RUNNER || 'ubuntu-latest' }}
    env:
      HTTP_PROXY: ${{ secrets.TN_GOV_HTTPS_PROXY }}
      HTTPS_PROXY: ${{ secrets.TN_GOV_HTTPS_PROXY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r "TN-Government Orders/requirements.txt"
          pip install -r Sync-Config/requirements.txt

      - name: Check tn.gov.in reachability
        id: tn_gov
        run: python Sync-Config/check_tn_gov_reachable.py
        continue-on-error: true

      - name: Refresh department government orders
        if: steps.tn_gov.outcome == 'success'
        run: |
          python "TN-Government Orders/tn_government_orders_sync.py" \
            --from-existing \
            --replace-orders

      - name: Report skipped government orders sync
        if: steps.tn_gov.outcome != 'success'
        run: |
          echo "::warning::Skipped government orders sync — www.tn.gov.in unreachable from this runner."
          echo "Set repository variable TN_GOV_RUNNER to a self-hosted runner in India,"
          echo "or secret TN_GOV_HTTPS_PROXY to an Indian HTTPS proxy."
          echo "See docs/GITHUB_ACTIONS.md for setup."

      - name: Commit and push updated JSON
        if: steps.tn_gov.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TN-Government Orders/Response JSON/"
          if git diff --staged --quiet; then
            echo "No government orders JSON changes to commit."
          else
            git commit -m "chore: update TN government orders $(date -u +%Y-%m-%d)"
            git push
          fi
