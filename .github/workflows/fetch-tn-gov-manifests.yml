name: Fetch TN Gov Manifests

on:
  schedule:
    # 11:00 PM IST (Asia/Kolkata) = 17:30 UTC
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-manifests:
    runs-on: ${{ vars.TN_GOV_RUNNER || 'ubuntu-latest' }}
    env:
      HTTP_PROXY: ${{ secrets.TN_GOV_HTTPS_PROXY }}
      HTTPS_PROXY: ${{ secrets.TN_GOV_HTTPS_PROXY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r "TN-GOV_Council Of Ministers/requirements.txt"
          pip install -r TN-GOV_Departments/requirements.txt
          pip install -r TN-GOV_Districts/requirements.txt
          pip install -r Sync-Config/requirements.txt

      - name: Check tn.gov.in reachability
        id: tn_gov
        run: python Sync-Config/check_tn_gov_reachable.py
        continue-on-error: true

      - name: Fetch Tamil Nadu ministers
        if: steps.tn_gov.outcome == 'success'
        run: python "TN-GOV_Council Of Ministers/tn_ministers_sync.py"

      - name: Fetch Tamil Nadu departments
        if: steps.tn_gov.outcome == 'success'
        run: python TN-GOV_Departments/tn_dept_sync.py

      - name: Fetch Tamil Nadu districts
        if: steps.tn_gov.outcome == 'success'
        run: python TN-GOV_Districts/tn_districts_sync.py

      - name: Report skipped tn.gov.in scrapers
        if: steps.tn_gov.outcome != 'success'
        run: |
          echo "::warning::Skipped tn.gov.in manifest sync — portal unreachable from this runner."
          echo "Set repository variable TN_GOV_RUNNER to a self-hosted runner in India,"
          echo "or secret TN_GOV_HTTPS_PROXY to an Indian HTTPS proxy."
          echo "See docs/GITHUB_ACTIONS.md for setup."

      - name: Commit and push updated manifests
        if: steps.tn_gov.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TN-GOV_Council Of Ministers/manifests/tn_ministers.json"
          git add "TN-GOV_Departments/manifests/tn_departments.json"
          git add "TN-GOV_Districts/manifests/tn_districts.json"
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore: update TN ministers, departments, and districts $(date -u +%Y-%m-%d)"
            git push
          fi
