name: Fetch TN DIPR Press Releases

on:
  schedule:
    # 11:00 PM IST (Asia/Kolkata) = 17:30 UTC
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-dipr-press-releases:
    # GitHub-hosted runners are often blocked by dipr.tn.gov.in. Set repository variable
    # TN_GOV_RUNNER to a self-hosted runner label (e.g. self-hosted) with India egress.
    runs-on: ${{ vars.TN_GOV_RUNNER || 'ubuntu-latest' }}
    env:
      HTTP_PROXY: ${{ secrets.TN_GOV_HTTPS_PROXY }}
      HTTPS_PROXY: ${{ secrets.TN_GOV_HTTPS_PROXY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r "TN-DIPR-Press Release/requirements.txt"
          pip install -r Sync-Config/requirements.txt

      - name: Check dipr.tn.gov.in reachability
        id: dipr
        run: python Sync-Config/check_dipr_reachable.py
        continue-on-error: true

      - name: Fetch today's DIPR press releases
        if: steps.dipr.outcome == 'success'
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%d-%m-%Y)
          python "TN-DIPR-Press Release/tn_press_release_sync.py" \
            --start-date "$TODAY" \
            --end-date "$TODAY"

      - name: Report skipped DIPR scraper
        if: steps.dipr.outcome != 'success'
        run: |
          echo "::warning::Skipped DIPR press release sync — dipr.tn.gov.in unreachable from this runner."
          echo "Set repository variable TN_GOV_RUNNER to a self-hosted runner in India,"
          echo "or secret TN_GOV_HTTPS_PROXY to an Indian HTTPS proxy."
          echo "See docs/GITHUB_ACTIONS.md for setup."

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "TN-DIPR-Press Release/Response JSON/"
          if git diff --staged --quiet; then
            echo "No DIPR press release JSON changes to commit."
          else
            git commit -m "chore: update TN DIPR press releases $(date -u +%Y-%m-%d)"
            git push
          fi
