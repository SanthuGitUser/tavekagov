name: CI Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # The build bundles data from these folders, so data changes can break it.
      - "TN-*/**"
      - "Sync-Config/*.json"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      # The build bundles data from these folders, so data changes can break it.
      - "TN-*/**"
      - "Sync-Config/*.json"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_BASE_PATH: /tavekagov/
        run: npm run build

      - name: Test
        run: npm run test
