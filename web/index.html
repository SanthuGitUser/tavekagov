<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TavekaGov — Tamil Nadu government open data dashboard"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TavekaGov" />
    <meta property="og:title" content="TavekaGov — Tamil Nadu open data" />
    <meta
      property="og:description"
      content="Independent dashboard of Tamil Nadu press releases, government orders, transfers, schemes, constituencies and election results."
    />
    <meta name="twitter:card" content="summary" />
    <title>TavekaGov — TN Open Data</title>
    <script>
      // GitHub Pages serves 404.html for deep links; it saves the requested path
      // and redirects here. Restore it before the router reads the URL.
      (function () {
        try {
          var redirect = sessionStorage.getItem("gh-pages-redirect");
          if (redirect) {
            sessionStorage.removeItem("gh-pages-redirect");
            history.replaceState(null, "", redirect);
          }
        } catch (error) {
          /* ignore */
        }
      })();
      (function () {
        try {
          if (localStorage.getItem("tavekagov-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
